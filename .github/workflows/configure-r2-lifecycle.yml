name: Configure R2 Lifecycle Rules

# Phase 4.3(a): immediate storage-cost bound with zero ongoing CI code.
# The only safe age-based rule for a YUM repo is aborting incomplete
# multipart uploads — RPMs and metadata blobs must never age-expire because
# a live (or rollback) repomd.xml may still reference them; retention for
# those is handled by prune-rpm-repo.yml. One-shot dispatch; re-run any
# time to reapply.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-r2-lifecycle
  cancel-in-progress: false

env:
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: rpm-nginx
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Show current lifecycle configuration
        run: |
          aws s3api get-bucket-lifecycle-configuration \
            --bucket "${R2_BUCKET}" --endpoint-url "${R2_ENDPOINT}" 2>&1 \
            || echo "(no lifecycle configuration set yet)"

      - name: Apply lifecycle configuration
        run: |
          cat > lifecycle.json << 'EOF'
          {
            "Rules": [
              {
                "ID": "abort-incomplete-multipart-7d",
                "Status": "Enabled",
                "Filter": { "Prefix": "" },
                "AbortIncompleteMultipartUpload": { "DaysAfterInitiation": 7 }
              }
            ]
          }
          EOF
          aws s3api put-bucket-lifecycle-configuration \
            --bucket "${R2_BUCKET}" --endpoint-url "${R2_ENDPOINT}" \
            --lifecycle-configuration file://lifecycle.json
          echo "DONE: lifecycle configuration applied"

      - name: Verify
        run: |
          aws s3api get-bucket-lifecycle-configuration \
            --bucket "${R2_BUCKET}" --endpoint-url "${R2_ENDPOINT}"
