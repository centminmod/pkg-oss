name: Upstream Version Watch

# Phase 6.1: weekly comparison of contrib/src/*/version pins against upstream
# releases/tags/commits (git ls-remote + version.nginx.com — tokenless, no
# API rate limits). Opens/updates a GitHub issue when bumps are found, with
# ready-to-append SHA512SUMS lines for nginx/njs/openssl/awslc.
# NOTE: the cron only fires once this file is on the default branch (master).

on:
  schedule:
    - cron: '23 4 * * 1'  # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: version-watch
  cancel-in-progress: false

jobs:
  version-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository (version pins + scripts)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: |
            .github/scripts
            contrib/src

      - name: Check upstream versions
        id: watch
        run: |
          RC=0
          WATCH_REPORT=version-watch-report.md \
            bash .github/scripts/version-watch.sh || RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          cat version-watch-report.md >> "$GITHUB_STEP_SUMMARY"
          # rc=1 (bumps found) is handled by the issue step; rc=2 (check
          # errors, e.g. network) fails the job so it shows up in Actions.
          [ "$RC" -le 1 ] || exit "$RC"

      - name: Open or update GitHub issue on bumps
        if: steps.watch.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create version-watch --color 0E8A16 \
            --description "Automated upstream version bump reports" 2>/dev/null || true

          {
            cat version-watch-report.md
            echo ""
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue-body.md

          EXISTING=$(gh issue list --label version-watch --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #${EXISTING}"
            gh issue comment "$EXISTING" --body-file issue-body.md
          else
            gh issue create \
              --title "Upstream version bumps available: $(date -u '+%Y-%m-%d')" \
              --label version-watch \
              --body-file issue-body.md
          fi
