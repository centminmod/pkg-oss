name: Rollback RPM Repository
run-name: "Rollback: ${{ inputs.variant }}/el${{ inputs.el_version }} (${{ inputs.snapshot || 'newest snapshot' }})"

# Phase 4.4: restore a previous repo entry point from the rollback snapshots
# that publish-rpm-repo.yml persists under <variant>/el/<EL>/rollback/.
# Only repomd.xml(.asc) is swapped — RPMs and metadata blobs are never
# deleted by publishes (--unique-md-filenames + sync-without-delete), so the
# previous metadata still resolves. Aborts if a referenced blob is missing.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Repository variant'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - awslc
          - openssl
          - optimized
          - optimized-v4
          - awslc-optimized
          - awslc-optimized-v4
          - bolt
      el_version:
        description: 'EL version'
        required: true
        default: '9'
        type: choice
        options:
          - '9'
          - '8'
          - '10'
      snapshot:
        description: 'Snapshot dir name under <variant>/el/<EL>/rollback/ (default: newest containing repomd.xml)'
        required: false
        type: string

permissions:
  contents: read

# Same group as publish-rpm-repo.yml: a rollback must never race a publish
# on the same repo path
concurrency:
  group: publish-${{ inputs.variant }}-el${{ inputs.el_version }}
  cancel-in-progress: false

env:
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: rpm-nginx
  CUSTOM_DOMAIN: rpm-nginx.centminmod.com
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  rollback:
    name: Rollback ${{ inputs.variant }}/el${{ inputs.el_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Derive paths
        run: |
          VARIANT="${{ inputs.variant }}"
          EL_VERSION="${{ inputs.el_version }}"
          if [ "$VARIANT" = "bolt" ] && [ "$EL_VERSION" != "9" ]; then
            echo "ERROR: BOLT variant is only available for EL9"
            exit 1
          fi
          {
            echo "VARIANT=${VARIANT}"
            echo "EL_VERSION=${EL_VERSION}"
            echo "REPO_PATH=${VARIANT}/el/${EL_VERSION}/x86_64"
            echo "SRPM_PATH=${VARIANT}/el/${EL_VERSION}/SRPMS"
            echo "SNAP_BASE=${VARIANT}/el/${EL_VERSION}/rollback"
          } >> "$GITHUB_ENV"

      - name: Select snapshot
        run: |
          echo "=== Snapshots under s3://${R2_BUCKET}/${SNAP_BASE}/ ==="
          PREFIXES=$(aws s3 ls "s3://${R2_BUCKET}/${SNAP_BASE}/" --endpoint-url "${R2_ENDPOINT}" \
            | awk '/PRE /{print $2}' | tr -d '/' | sort)
          if [ -z "$PREFIXES" ]; then
            echo "ERROR: no rollback snapshots exist for ${VARIANT}/el${EL_VERSION}"
            exit 1
          fi
          echo "$PREFIXES"

          REQUESTED="${{ inputs.snapshot }}"
          if [ -n "$REQUESTED" ]; then
            if ! echo "$PREFIXES" | grep -qxF "$REQUESTED"; then
              echo "ERROR: requested snapshot '${REQUESTED}' not found"
              exit 1
            fi
            SNAP="$REQUESTED"
          else
            # newest snapshot that actually contains a repomd.xml (first
            # publishes create manifest-only snapshots)
            SNAP=""
            for p in $(echo "$PREFIXES" | sort -r); do
              if aws s3 ls "s3://${R2_BUCKET}/${SNAP_BASE}/${p}/repomd.xml" \
                   --endpoint-url "${R2_ENDPOINT}" > /dev/null 2>&1; then
                SNAP="$p"
                break
              fi
            done
            if [ -z "$SNAP" ]; then
              echo "ERROR: no snapshot contains a repomd.xml — nothing to roll back to"
              exit 1
            fi
          fi
          echo ""
          echo "Selected snapshot: ${SNAP}"
          echo "SNAP=${SNAP}" >> "$GITHUB_ENV"

      - name: Download snapshot and verify referenced blobs exist
        run: |
          mkdir -p snapshot
          aws s3 cp "s3://${R2_BUCKET}/${SNAP_BASE}/${SNAP}/repomd.xml" snapshot/repomd.xml \
            --endpoint-url "${R2_ENDPOINT}"
          aws s3 cp "s3://${R2_BUCKET}/${SNAP_BASE}/${SNAP}/repomd.xml.asc" snapshot/repomd.xml.asc \
            --endpoint-url "${R2_ENDPOINT}" 2>/dev/null || echo "note: snapshot has no repomd.xml.asc (pre-signing era)"
          aws s3 cp "s3://${R2_BUCKET}/${SNAP_BASE}/${SNAP}/srpms-repomd.xml" snapshot/srpms-repomd.xml \
            --endpoint-url "${R2_ENDPOINT}" 2>/dev/null || true
          aws s3 cp "s3://${R2_BUCKET}/${SNAP_BASE}/${SNAP}/srpms-repomd.xml.asc" snapshot/srpms-repomd.xml.asc \
            --endpoint-url "${R2_ENDPOINT}" 2>/dev/null || true

          echo "=== Snapshot repomd.xml ==="
          cat snapshot/repomd.xml
          echo ""
          echo "=== Verify referenced metadata blobs still exist ==="
          HREFS=$(grep -o 'href="repodata/[^"]*"' snapshot/repomd.xml | sed 's/href="//;s/"//')
          MISSING=0
          for h in $HREFS; do
            if aws s3 ls "s3://${R2_BUCKET}/${REPO_PATH}/${h}" --endpoint-url "${R2_ENDPOINT}" > /dev/null 2>&1; then
              echo "PASS: ${h}"
            else
              echo "FAIL: ${h} MISSING from bucket"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: ${MISSING} referenced blob(s) missing (pruned?) — rollback impossible"
            exit 1
          fi

      - name: Snapshot current entry point (pre-rollback, enables roll-forward)
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          PRE="${SNAP_BASE}/${TS}-run${{ github.run_id }}-pre-rollback"
          if aws s3 cp "s3://${R2_BUCKET}/${REPO_PATH}/repodata/repomd.xml" current-repomd.xml \
               --endpoint-url "${R2_ENDPOINT}" 2>/dev/null; then
            aws s3 cp current-repomd.xml "s3://${R2_BUCKET}/${PRE}/repomd.xml" \
              --endpoint-url "${R2_ENDPOINT}" --content-type "application/xml"
            aws s3 cp "s3://${R2_BUCKET}/${REPO_PATH}/repodata/repomd.xml.asc" current-repomd.xml.asc \
              --endpoint-url "${R2_ENDPOINT}" 2>/dev/null \
              && aws s3 cp current-repomd.xml.asc "s3://${R2_BUCKET}/${PRE}/repomd.xml.asc" \
                   --endpoint-url "${R2_ENDPOINT}" --content-type "application/pgp-signature" \
              || true
            echo "Current entry point preserved at ${PRE}/"
          else
            echo "note: no current repomd.xml to preserve"
          fi

      - name: Restore entry point (asc first, repomd.xml last)
        run: |
          if [ -f snapshot/repomd.xml.asc ]; then
            aws s3 cp snapshot/repomd.xml.asc "s3://${R2_BUCKET}/${REPO_PATH}/repodata/repomd.xml.asc" \
              --endpoint-url "${R2_ENDPOINT}" \
              --content-type "application/pgp-signature" \
              --cache-control "public, max-age=30"
          fi
          aws s3 cp snapshot/repomd.xml "s3://${R2_BUCKET}/${REPO_PATH}/repodata/repomd.xml" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/xml" \
            --cache-control "public, max-age=30"
          echo "DONE: entry point restored from ${SNAP}"

          if [ -f snapshot/srpms-repomd.xml ]; then
            echo "=== Restore SRPMS entry point ==="
            if [ -f snapshot/srpms-repomd.xml.asc ]; then
              aws s3 cp snapshot/srpms-repomd.xml.asc "s3://${R2_BUCKET}/${SRPM_PATH}/repodata/repomd.xml.asc" \
                --endpoint-url "${R2_ENDPOINT}" \
                --content-type "application/pgp-signature" \
                --cache-control "public, max-age=30"
            fi
            aws s3 cp snapshot/srpms-repomd.xml "s3://${R2_BUCKET}/${SRPM_PATH}/repodata/repomd.xml" \
              --endpoint-url "${R2_ENDPOINT}" \
              --content-type "application/xml" \
              --cache-control "public, max-age=30"
          fi

      - name: Purge CDN cache
        run: |
          PURGE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"prefixes\":[\"${CUSTOM_DOMAIN}/${REPO_PATH}\",\"${CUSTOM_DOMAIN}/${SRPM_PATH}\"]}")
          HTTP_CODE=$(echo "$PURGE_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          echo "Purge HTTP code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARNING: CDN purge returned HTTP $HTTP_CODE (non-fatal)"
          fi
          echo "Waiting 30s for purge propagation..."
          sleep 30

      - name: Verify rolled-back repo from CDN
        run: |
          echo "=== CDN repomd.xml must match the snapshot ==="
          curl -sf "https://${CUSTOM_DOMAIN}/${REPO_PATH}/repodata/repomd.xml" -o live-repomd.xml
          WANT=$(sha256sum snapshot/repomd.xml | cut -d' ' -f1)
          GOT=$(sha256sum live-repomd.xml | cut -d' ' -f1)
          if [ "$WANT" = "$GOT" ]; then
            echo "PASS: live repomd.xml matches snapshot (${GOT})"
          else
            echo "FAIL: live repomd.xml sha256 ${GOT} != snapshot ${WANT}"
            exit 1
          fi

          echo ""
          echo "=== dnf install test against the rolled-back repo ==="
          case "${VARIANT}" in
            awslc|awslc-optimized|awslc-optimized-v4) BASE_PKG="centminmod-nginx-awslc" ;;
            openssl) BASE_PKG="centminmod-nginx-openssl" ;;
            *)       BASE_PKG="centminmod-nginx" ;;
          esac
          if [ -f snapshot/repomd.xml.asc ]; then GPG=1; else GPG=0; fi
          docker run --rm \
            -e EL="${EL_VERSION}" -e VARIANT="${VARIANT}" -e BASE_PKG="$BASE_PKG" -e GPG="$GPG" \
            almalinux:${EL_VERSION} bash -c '
              set -euo pipefail
              GPGKEY_LINE=""
              if [ "$GPG" = "1" ]; then
                rpm --import https://rpm-nginx.centminmod.com/RPM-GPG-KEY-centminmod-nginx
                GPGKEY_LINE="gpgkey=https://rpm-nginx.centminmod.com/RPM-GPG-KEY-centminmod-nginx"
              fi
              cat > /etc/yum.repos.d/rollback-test.repo << REPOEOF
          [rollback-test]
          name=Rollback test
          baseurl=https://rpm-nginx.centminmod.com/${VARIANT}/el/${EL}/\$basearch
          enabled=1
          gpgcheck=${GPG}
          repo_gpgcheck=${GPG}
          ${GPGKEY_LINE}
          metadata_expire=60
          skip_if_unavailable=0
          REPOEOF
              dnf -y makecache 2>&1 | tail -2
              dnf module disable -y nginx 2>/dev/null || true
              dnf -y install "$BASE_PKG" nginx-module-headers-more 2>&1 | tail -3
              /usr/local/sbin/nginx -v
              /usr/local/sbin/nginx -t
              echo "PASS: install from rolled-back repo works"
            '

      - name: Rollback summary
        run: |
          echo "=========================================="
          echo "=== ROLLBACK SUMMARY                   ==="
          echo "=========================================="
          echo "  Variant:   ${VARIANT}"
          echo "  EL:        ${EL_VERSION}"
          echo "  Snapshot:  ${SNAP}"
          echo "  Repo:      https://${CUSTOM_DOMAIN}/${REPO_PATH}/"
          echo "=========================================="
