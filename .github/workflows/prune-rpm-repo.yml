name: Prune RPM Repository
run-name: "Prune: ${{ inputs.variant }}/el${{ inputs.el_version }} keep=${{ inputs.keep }}${{ inputs.dry_run == true && ' [dry-run]' || '' }}"

# Phase 4.3(b): manifest/inventory-based retention. Publishes never delete
# (aws s3 sync + --unique-md-filenames), so old RPM NEVRAs and orphaned
# metadata blobs accumulate. This workflow:
#   1. inventories the bucket (remote state is the source of truth)
#   2. keeps the newest KEEP NEVRAs per package name
#   3. regenerates + re-signs metadata from the complete keep set
#   4. uploads metadata (blobs first, repomd.xml last)
#   5. only then deletes pruned RPMs and unreferenced metadata blobs
# Pruning is a retention boundary: earlier rollback snapshots reference
# deleted objects, so their repomd files are removed too (manifest.json is
# kept for audit). dry_run (default) reports without mutating anything.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Repository variant'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - awslc
          - openssl
          - optimized
          - optimized-v4
          - awslc-optimized
          - awslc-optimized-v4
          - bolt
      el_version:
        description: 'EL version'
        required: true
        default: '9'
        type: choice
        options:
          - '9'
          - '8'
          - '10'
      keep:
        description: 'NEVRAs to keep per package name'
        required: false
        default: '3'
        type: string
      dry_run:
        description: 'Report what would be pruned without changing anything'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Same group as publish/rollback: never race another writer on this path
concurrency:
  group: publish-${{ inputs.variant }}-el${{ inputs.el_version }}
  cancel-in-progress: false

env:
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: rpm-nginx
  CUSTOM_DOMAIN: rpm-nginx.centminmod.com
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  prune:
    name: Prune ${{ inputs.variant }}/el${{ inputs.el_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout signing scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: |
            .github/scripts

      - name: Derive paths
        run: |
          VARIANT="${{ inputs.variant }}"
          EL_VERSION="${{ inputs.el_version }}"
          if [ "$VARIANT" = "bolt" ] && [ "$EL_VERSION" != "9" ]; then
            echo "ERROR: BOLT variant is only available for EL9"
            exit 1
          fi
          KEEP="${{ inputs.keep }}"
          case "$KEEP" in
            ''|*[!0-9]*) echo "ERROR: keep must be a positive integer"; exit 1 ;;
          esac
          if [ "$KEEP" -lt 1 ]; then echo "ERROR: keep must be >= 1"; exit 1; fi
          {
            echo "VARIANT=${VARIANT}"
            echo "EL_VERSION=${EL_VERSION}"
            echo "KEEP=${KEEP}"
            echo "REPO_PATH=${VARIANT}/el/${EL_VERSION}/x86_64"
            echo "SNAP_BASE=${VARIANT}/el/${EL_VERSION}/rollback"
          } >> "$GITHUB_ENV"

      - name: Inventory bucket and compute keep/prune sets
        run: |
          echo "=== Remote inventory: s3://${R2_BUCKET}/${REPO_PATH}/ ==="
          aws s3 ls "s3://${R2_BUCKET}/${REPO_PATH}/" --endpoint-url "${R2_ENDPOINT}" \
            | awk '{print $4}' | grep '\.rpm$' | sort > all-rpms.txt || true
          RPM_COUNT=$(grep -c . all-rpms.txt || true)
          echo "${RPM_COUNT} RPMs in bucket"
          if [ "$RPM_COUNT" -eq 0 ]; then
            echo "ERROR: no RPMs found — refusing to prune an empty/missing repo"
            exit 1
          fi

          # Split NEVRA from filename: <name>-<ver>-<rel>.<arch>.rpm
          # (version-release ordering via sort -V; adequate for the
          # digit-leading versions this repo publishes)
          : > nevra.txt
          while read -r f; do
            base=${f%.rpm}
            base=${base%.*}          # strip arch
            rel=${base##*-}; base=${base%-*}
            ver=${base##*-}; name=${base%-*}
            echo "${name}|${ver}-${rel}|${f}" >> nevra.txt
          done < all-rpms.txt

          : > keep.txt
          : > prune.txt
          for name in $(cut -d'|' -f1 nevra.txt | sort -u); do
            grep "^${name}|" nevra.txt | sort -t'|' -k2,2V -r | {
              i=0
              while IFS='|' read -r _ _ file; do
                i=$((i+1))
                if [ "$i" -le "$KEEP" ]; then
                  echo "$file" >> keep.txt
                else
                  echo "$file" >> prune.txt
                fi
              done
            }
          done
          sort -o keep.txt keep.txt
          sort -o prune.txt prune.txt

          echo ""
          echo "=== Keep set ($(grep -c . keep.txt || true) RPMs, keep=${KEEP} per name) ==="
          cat keep.txt
          echo ""
          echo "=== Prune set ($(grep -c . prune.txt || true) RPMs) ==="
          cat prune.txt || true

          echo ""
          echo "=== Current repodata blobs ==="
          aws s3 ls "s3://${R2_BUCKET}/${REPO_PATH}/repodata/" --endpoint-url "${R2_ENDPOINT}" \
            | awk '{print $4}' | grep -v '^$' | sort > all-repodata.txt || true
          cat all-repodata.txt

      - name: Dry-run report
        if: ${{ inputs.dry_run != false }}
        run: |
          echo "=========================================="
          echo "DRY RUN — nothing was changed"
          echo "=========================================="
          echo "Would keep:   $(grep -c . keep.txt || true) RPMs"
          echo "Would delete: $(grep -c . prune.txt || true) RPMs"
          echo "Metadata would be regenerated from the keep set and orphaned"
          echo "repodata blobs + stale rollback repomd snapshots removed."
          echo "Re-run with dry_run=false to apply."

      - name: Download keep set
        if: ${{ inputs.dry_run == false }}
        run: |
          mkdir -p "repo/${REPO_PATH}"
          while read -r f; do
            aws s3 cp "s3://${R2_BUCKET}/${REPO_PATH}/${f}" "repo/${REPO_PATH}/${f}" \
              --endpoint-url "${R2_ENDPOINT}" --no-progress
          done < keep.txt
          echo "$(ls "repo/${REPO_PATH}" | wc -l) RPMs downloaded"

      - name: Regenerate repository metadata (createrepo_c)
        if: ${{ inputs.dry_run == false }}
        run: |
          docker run --rm \
            -v "$(pwd)/repo/${REPO_PATH}:/repo" \
            almalinux:9 bash -c '
              dnf -y -q install createrepo_c >/dev/null
              createrepo_c \
                --compress-type gz \
                --checksum sha256 \
                --unique-md-filenames \
                --workers $(nproc) \
                /repo
              ls -lh /repo/repodata/
            '

      - name: GPG sign repository metadata
        if: ${{ inputs.dry_run == false }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "ERROR: GPG_PRIVATE_KEY secret is not configured"
            exit 1
          fi
          docker run --rm \
            -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE \
            -v "$(pwd):/work" \
            -v "$(pwd)/.github/scripts:/scripts:ro" \
            almalinux:9 bash /scripts/sign-repomd.sh "/work/repo/${REPO_PATH}"

      - name: Upload new metadata (blobs first, repomd.xml last)
        if: ${{ inputs.dry_run == false }}
        run: |
          aws s3 sync "repo/${REPO_PATH}/repodata/" "s3://${R2_BUCKET}/${REPO_PATH}/repodata/" \
            --endpoint-url "${R2_ENDPOINT}" \
            --exclude "repomd.xml" \
            --exclude "repomd.xml.asc" \
            --content-type "application/gzip" \
            --cache-control "public, max-age=120" \
            --no-progress
          aws s3 cp "repo/${REPO_PATH}/repodata/repomd.xml.asc" \
            "s3://${R2_BUCKET}/${REPO_PATH}/repodata/repomd.xml.asc" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/pgp-signature" \
            --cache-control "public, max-age=30"
          aws s3 cp "repo/${REPO_PATH}/repodata/repomd.xml" \
            "s3://${R2_BUCKET}/${REPO_PATH}/repodata/repomd.xml" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/xml" \
            --cache-control "public, max-age=30"
          echo "DONE: new entry point live"

      - name: Delete pruned RPMs and orphaned metadata (after new repomd is live)
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "=== Delete pruned RPMs ==="
          while read -r f; do
            [ -n "$f" ] || continue
            echo "rm ${REPO_PATH}/${f}"
            aws s3 rm "s3://${R2_BUCKET}/${REPO_PATH}/${f}" --endpoint-url "${R2_ENDPOINT}"
          done < prune.txt

          echo ""
          echo "=== Delete repodata blobs not referenced by the new repomd ==="
          ls "repo/${REPO_PATH}/repodata/" | sort > new-repodata.txt
          # all-repodata.txt is the pre-prune bucket listing
          comm -23 all-repodata.txt new-repodata.txt | while read -r b; do
            [ -n "$b" ] || continue
            echo "rm ${REPO_PATH}/repodata/${b}"
            aws s3 rm "s3://${R2_BUCKET}/${REPO_PATH}/repodata/${b}" --endpoint-url "${R2_ENDPOINT}"
          done

          echo ""
          echo "=== Invalidate stale rollback snapshots (keep manifest.json for audit) ==="
          # Older snapshots reference objects deleted above; removing their
          # repomd files makes rollback-rpm-repo.yml skip them cleanly.
          aws s3 ls "s3://${R2_BUCKET}/${SNAP_BASE}/" --endpoint-url "${R2_ENDPOINT}" --recursive \
            | awk '{print $4}' | grep -E '/(srpms-)?repomd\.xml(\.asc)?$' | while read -r k; do
              echo "rm ${k}"
              aws s3 rm "s3://${R2_BUCKET}/${k}" --endpoint-url "${R2_ENDPOINT}"
            done || true

      - name: Purge CDN and verify
        if: ${{ inputs.dry_run == false }}
        run: |
          PURGE_RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "{\"prefixes\":[\"${CUSTOM_DOMAIN}/${REPO_PATH}\"]}")
          HTTP_CODE=$(echo "$PURGE_RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          echo "Purge HTTP code: $HTTP_CODE"
          echo "Waiting 30s for purge propagation..."
          sleep 30

          echo "=== dnf makecache + install against the pruned repo ==="
          case "${VARIANT}" in
            awslc|awslc-optimized|awslc-optimized-v4) BASE_PKG="centminmod-nginx-awslc" ;;
            openssl) BASE_PKG="centminmod-nginx-openssl" ;;
            *)       BASE_PKG="centminmod-nginx" ;;
          esac
          docker run --rm \
            -e EL="${EL_VERSION}" -e VARIANT="${VARIANT}" -e BASE_PKG="$BASE_PKG" \
            almalinux:${EL_VERSION} bash -c '
              set -euo pipefail
              rpm --import https://rpm-nginx.centminmod.com/RPM-GPG-KEY-centminmod-nginx
              cat > /etc/yum.repos.d/prune-test.repo << REPOEOF
          [prune-test]
          name=Prune test
          baseurl=https://rpm-nginx.centminmod.com/${VARIANT}/el/${EL}/\$basearch
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://rpm-nginx.centminmod.com/RPM-GPG-KEY-centminmod-nginx
          metadata_expire=60
          skip_if_unavailable=0
          REPOEOF
              dnf -y makecache 2>&1 | tail -2
              dnf module disable -y nginx 2>/dev/null || true
              dnf -y install "$BASE_PKG" nginx-module-headers-more 2>&1 | tail -3
              /usr/local/sbin/nginx -v
              echo "PASS: install from pruned repo works"
            '

      - name: Prune summary
        if: always()
        run: |
          echo "=========================================="
          echo "=== PRUNE SUMMARY                      ==="
          echo "=========================================="
          echo "  Variant:  ${VARIANT:-${{ inputs.variant }}}"
          echo "  EL:       ${EL_VERSION:-${{ inputs.el_version }}}"
          echo "  Keep:     ${KEEP:-${{ inputs.keep }}} per package name"
          echo "  Dry run:  ${{ inputs.dry_run }}"
          echo "  Kept:     $(grep -c . keep.txt 2>/dev/null || echo '?') RPMs"
          echo "  Pruned:   $(grep -c . prune.txt 2>/dev/null || echo '?') RPMs"
          echo "=========================================="
